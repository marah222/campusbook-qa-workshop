name: CampusBook QA
on:
  push:
    branches: [main, develop, 'team-*']
  pull_request:
    branches: [main, develop, 'team-*']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Allow only develop to propose releases into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "develop" ]; then
            echo "::error::Release PRs into main must come from develop."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install teaching dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "WARNING: package-lock.json missing. Instructor must commit it before class."
            npm install --no-audit --no-fund
          fi
      - name: Compile and type-check
        run: npm run build && npm run check
      - name: Verify test starter layout
        run: npm run classroom:verify && npm run classroom:starters
      - name: Infrastructure smoke test
        run: npm run test:smoke
      # Future coverage gate: add Vitest coverage once student tests are implemented.
      # Current TODO/skip starters are not meaningful coverage evidence.
      - name: Unit tests
        run: npm run test:unit
      - name: Release evidence and executable story checks
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/governance/verify-release.mjs
      - name: Install Chromium and Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Verify Playwright test discovery
        run: npm run classroom:playwright-list
      - name: API tests
        run: npm run test:api
      - name: UI tests
        run: npm run test:ui
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

  unit-coverage:
    name: unit-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install matching Vitest coverage provider for CI
        run: npm install --no-save --package-lock=false @vitest/coverage-v8@5.0.1
      - name: Measure and enforce domain unit coverage
        run: npm run test:coverage
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: coverage/
          if-no-files-found: ignore

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL for JavaScript and TypeScript
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
